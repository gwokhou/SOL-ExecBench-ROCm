schema_version: sol_execbench.rocprofv3_counter_manifest.v1
architecture: gfx1200
rocm_compatibility: "7.2"
groups:
  - name: compute_wmma
    counters:
      - metric: waves
        alternatives: [SQ_WAVES]
      - metric: valu_instructions
        alternatives: [VALUInsts, SQ_INSTS_VALU, SQ_INSTS_VALU_ADD]
      - metric: wmma_instructions
        alternatives: [SQ_INSTS_MFMA, SQ_INSTS_WMMA, MFMAInsts]
        required: false
  - name: memory_cache
    counters:
      - metric: bytes_read
        alternatives: [FETCH_SIZE, GL2C_EA_RDREQ_32B_sum, TCC_EA_RDREQ_32B_sum]
      - metric: bytes_written
        alternatives: [WRITE_SIZE, GL2C_EA_WRREQ_64B_sum, TCC_EA_WRREQ_64B_sum]
      - metric: cache_misses
        alternatives: [GL2C_MISS_sum, TCC_MISS, L2CacheMiss]
        required: false
  - name: lds
    counters:
      - metric: lds_instructions
        alternatives: [SQ_INSTS_LDS, LDSInsts]
      - metric: lds_bank_conflicts
        alternatives: [LDSBankConflict, SQC_LDS_BANK_CONFLICT, SQ_LDS_BANK_CONFLICT]
        required: false
  - name: wave_occupancy
    counters:
      - metric: wave_cycles
        alternatives: [SQ_WAVE_CYCLES, WavefrontOccupancy]
      - metric: occupancy
        alternatives: [MeanOccupancyPerCU, OccupancyPercent]
        required: false
