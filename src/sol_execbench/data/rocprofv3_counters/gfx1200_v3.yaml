schema_version: sol_execbench.rocprofv3_counter_manifest.v3
architecture: gfx1200
rocm_compatibility: "7.2"
groups:
  - name: compute_wmma
    counters:
      - metric: waves
        alternatives:
          - {name: SQ_WAVES_sum, native_unit: waves, multiplier: 1}
        normalized_unit: waves
        scope: dispatch
        aggregation: sum
        sanity: positive
  - name: memory_traffic
    counters:
      - metric: bytes_read
        alternatives:
          - {name: FETCH_SIZE, native_unit: kibibytes, multiplier: 1024}
        normalized_unit: bytes
        scope: dispatch
        aggregation: sum
        sanity: positive
      - metric: bytes_written
        alternatives:
          - {name: GL2C_EA_WRREQ_64B_sum, native_unit: transactions_64b, multiplier: 64}
        normalized_unit: bytes
        scope: dispatch
        aggregation: sum
        sanity: non_negative
  - name: cache
    counters:
      - metric: cache_misses
        alternatives:
          - {name: GL2C_MISS_sum, native_unit: requests, multiplier: 1}
          - {name: TCC_MISS, native_unit: requests, multiplier: 1}
          - {name: L2CacheMiss, native_unit: requests, multiplier: 1}
        required: false
        normalized_unit: requests
        scope: dispatch
        aggregation: sum
        sanity: non_negative
      - metric: cache_hits
        alternatives:
          - {name: GL2C_HIT_sum, native_unit: requests, multiplier: 1}
        required: false
        normalized_unit: requests
        scope: dispatch
        aggregation: sum
        sanity: non_negative
  - name: lds
    counters:
      - metric: lds_bank_conflict_percent
        alternatives:
          - {name: LDSBankConflict, native_unit: percent, multiplier: 1}
        required: false
        normalized_unit: percent
        scope: dispatch
        aggregation: maximum
        sanity: non_negative
