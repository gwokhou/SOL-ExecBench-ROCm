# Engineering proposal for gfx942 (CDNA3 / AMD Instinct MI300X) counter
# selection. Confidence: inexact. The exact counter spellings MUST be confirmed
# on real gfx942 hardware via `rocprofv3-avail -d 0 info --pmc` before this
# manifest is treated as validated. The cache_lds group below reuses RDNA
# spellings as placeholders; CDNA3 exposes different L2/TCP cache counters.
# waves/bytes metrics stay `required` so collection fails closed if a spelling
# is absent, rather than silently undercounting traffic.
schema_version: sol_execbench.rocprofv3_counter_manifest.v3
architecture: gfx942
rocm_compatibility: "7.2"
groups:
  - name: compute_memory_traffic
    counters:
      - metric: waves
        alternatives:
          - {name: SQ_WAVES_sum, native_unit: waves, multiplier: 1}
        normalized_unit: waves
        scope: dispatch
        aggregation: sum
        sanity: positive
      - metric: bytes_read
        alternatives:
          - {name: FETCH_SIZE, native_unit: kibibytes, multiplier: 1024}
        normalized_unit: bytes
        scope: dispatch
        aggregation: sum
        sanity: positive
      - metric: bytes_written
        alternatives:
          - {name: WRITE_SIZE, native_unit: kibibytes, multiplier: 1024}
        normalized_unit: bytes
        scope: dispatch
        aggregation: sum
        sanity: non_negative
  - name: cache_lds
    counters:
      - metric: cache_misses
        alternatives:
          - {name: TCC_MISS, native_unit: requests, multiplier: 1}
          - {name: L2CacheMiss, native_unit: requests, multiplier: 1}
        required: false
        normalized_unit: requests
        scope: dispatch
        aggregation: sum
        sanity: non_negative
      - metric: cache_hits
        alternatives:
          - {name: TCC_HIT, native_unit: requests, multiplier: 1}
        required: false
        normalized_unit: requests
        scope: dispatch
        aggregation: sum
        sanity: non_negative
      - metric: lds_bank_conflict_percent
        alternatives:
          - {name: SQ_LDS_BANK_CONFLICT, native_unit: percent, multiplier: 1}
          - {name: LDSBankConflict, native_unit: percent, multiplier: 1}
        required: false
        normalized_unit: percent
        scope: dispatch
        aggregation: maximum
        sanity: non_negative
