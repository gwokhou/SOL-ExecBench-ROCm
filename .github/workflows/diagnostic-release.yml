name: Diagnostic Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag of the draft release to verify and publish"
        required: true

permissions:
  # Only this GitHub-hosted job holds release authority. The self-hosted GPU
  # runner (rdna4-hardware.yml) stays read-only and only produces evidence.
  contents: write
  actions: read

concurrency:
  group: diagnostic-release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  UV_NO_PROGRESS: "1"

jobs:
  verify-and-publish-draft:
    name: Verify checksum and publication, then publish draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Validate the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            diagnostic-lifecycle-p0-conformance-v1)
              RELEASE_PURPOSE="control_plane_conformance"
              ;;
            gfx1200-diagnostics-v7-production-v1)
              RELEASE_PURPOSE="production"
              ;;
            *)
              echo "unsupported diagnostic release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          echo "TAG_SHA=$TAG_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_PURPOSE=$RELEASE_PURPOSE" >> "$GITHUB_ENV"
          echo "release tag validated: $RELEASE_TAG"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install locked environment
        run: uv sync --locked --all-groups
      - name: Download successful exact-SHA RDNA4 validation
        run: |
          RUN_ID="$(gh run list --workflow rdna4-hardware.yml \
            --commit "$TAG_SHA" --event workflow_dispatch --status success \
            --limit 100 --json databaseId,headSha \
            --jq 'map(select(.headSha == env.TAG_SHA)) | first | .databaseId // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "no successful manual RDNA4 validation exists for $TAG_SHA" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/hardware"
          gh run download "$RUN_ID" --pattern 'rdna4-gfx1200-*' \
            --dir "$RUNNER_TEMP/hardware"
          RECEIPT="$(find "$RUNNER_TEMP/hardware" -name receipt.json -type f -print -quit)"
          if [ -z "$RECEIPT" ]; then
            echo "RDNA4 validation receipt is absent or expired" >&2
            exit 1
          fi
          echo "HARDWARE_RECEIPT=$RECEIPT" >> "$GITHUB_ENV"
          echo "HARDWARE_EVIDENCE_DIR=$(dirname "$RECEIPT")" >> "$GITHUB_ENV"
      - name: Download draft release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release"
      - name: Verify archive SHA-256 against the attestation
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib, json, os, pathlib
          release = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release"
          tag = os.environ["RELEASE_TAG"]
          expected_names = {f"{tag}.tar.zst", f"{tag}.attestation.json"}
          actual_names = {path.name for path in release.iterdir()}
          if actual_names != expected_names:
              raise SystemExit(
                  f"release assets {sorted(actual_names)} != {sorted(expected_names)}"
              )
          attestation = json.loads(
              (release / f"{tag}.attestation.json")
              .read_text(encoding="utf-8")
          )
          if attestation["source_revision"] != os.environ["TAG_SHA"]:
              raise SystemExit("attestation source revision != release tag commit")
          if attestation["purpose"] != os.environ["RELEASE_PURPOSE"]:
              raise SystemExit("release purpose differs from tag policy")
          expected = attestation["archive"]["sha256"]
          archive = release / f"{tag}.tar.zst"
          checksum = hashlib.sha256()
          with archive.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  checksum.update(chunk)
          digest = checksum.hexdigest()
          if digest != expected:
              raise SystemExit(
                  f"archive SHA-256 {digest} != attestation {expected}"
              )
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "expected-sha256").write_text(expected)
          print(f"verified archive SHA-256: {expected}")
          PY
      - name: Verify exact-SHA hardware release binding
        run: |
          uv run --no-sync python scripts/internal/rdna4/verify_release_gate.py \
            --receipt "$HARDWARE_RECEIPT" \
            --evidence-dir "$HARDWARE_EVIDENCE_DIR" \
            --source-revision "$TAG_SHA" \
            --attestation "$RUNNER_TEMP/release/$RELEASE_TAG.attestation.json" \
            --attestation-kind diagnostic \
            --binding-output "$RUNNER_TEMP/hardware-binding.json"
      - name: Unpack and verify the publication (CPU-only)
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          uv run --no-sync sol-execbench --format json diagnostics \
            release verify \
            --archive "$RUNNER_TEMP/release/$RELEASE_TAG.tar.zst" \
            --expected-sha256 "$(cat "$RUNNER_TEMP/expected-sha256")" \
            --unpack-root "$RUNNER_TEMP/unpacked"
      - name: Rebuild the release attestation from the verified tree
        run: |
          uv run --no-sync sol-execbench --format json diagnostics release \
            package \
            --manifest "$RUNNER_TEMP/unpacked/publication/publication.json" \
            --archive-output "$RUNNER_TEMP/rebuilt.tar.zst" \
            --attestation-output "$RUNNER_TEMP/rebuilt.attestation.json" \
            --source-revision "$TAG_SHA" \
            --hardware-validation-receipt "$HARDWARE_RECEIPT" \
            --hardware-evidence-dir "$HARDWARE_EVIDENCE_DIR" \
            --purpose "$RELEASE_PURPOSE"
      - name: Require content-identical deterministic rebuild
        run: |
          uv run --no-sync python - <<'PY'
          import json, os, pathlib
          from sol_execbench.core.bench.performance_model.lifecycle.enums import (
              DiagnosticEvidencePurpose,
          )
          from sol_execbench.core.bench.performance_model.lifecycle.identity import (
              release_id,
          )
          runner = pathlib.Path(os.environ["RUNNER_TEMP"])
          tag = os.environ["RELEASE_TAG"]
          published = json.loads((
              runner / "release" /
              f"{tag}.attestation.json"
          ).read_text())
          rebuilt = json.loads(
              (runner / "rebuilt.attestation.json").read_text()
          )
          if rebuilt["archive"]["sha256"] != published["archive"]["sha256"]:
              raise SystemExit("rebuilt archive bytes differ from release asset")
          comparable_fields = (
              "purpose",
              "uncompressed_size_bytes",
              "case_count",
              "inventory_sha256",
              "source_revision",
              "hardware_validation",
              "producer_version",
              "retention_class",
              "diagnostic_only",
              "score_authority",
              "leaderboard_authority",
          )
          for field in comparable_fields:
              if rebuilt[field] != published[field]:
                  raise SystemExit(f"rebuilt attestation field differs: {field}")
          comparable_archive_fields = (
              "sha256",
              "size_bytes",
              "algorithm",
              "publication_manifest_sha256",
              "source_revision",
          )
          for field in comparable_archive_fields:
              if rebuilt["archive"][field] != published["archive"][field]:
                  raise SystemExit(f"rebuilt archive field differs: {field}")
          expected_release_id = release_id(
              publication_id=published["publication_id"],
              archive_sha256=published["archive"]["sha256"],
              source_revision=published["source_revision"],
              producer_version=published["producer_version"],
              archive_size_bytes=published["archive"]["size_bytes"],
              hardware_validation_receipt_sha256=(
                  published["hardware_validation"]["receipt_sha256"]
              ),
              purpose=DiagnosticEvidencePurpose(published["purpose"]),
          )
          if expected_release_id != published["release_id"]:
              raise SystemExit("published release identity does not recompute")
          print("rebuilt archive is byte-identical and release identity is valid")
          PY
      - name: Publish the draft release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib, json, os, pathlib
          runner = pathlib.Path(os.environ["RUNNER_TEMP"])
          tag = os.environ["RELEASE_TAG"]
          attestation = (
              runner / "release" /
              f"{tag}.attestation.json"
          )
          notes = {
              "attestation_sha256": hashlib.sha256(
                  attestation.read_bytes()
              ).hexdigest(),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
          }
          (runner / "release-notes.json").write_text(
              json.dumps(notes, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          gh release edit "$RELEASE_TAG" --draft=false \
            --notes-file \
            "$RUNNER_TEMP/release-notes.json"
