name: Score Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag of the draft release to verify and publish"
        required: true

permissions:
  # Only this GitHub-hosted job holds release authority. The self-hosted GPU
  # runner (rdna4-hardware.yml) stays read-only and only produces evidence.
  contents: write
  actions: read

concurrency:
  group: score-release
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  # Authenticate the gh CLI (release download/edit) with the workflow token.
  GH_TOKEN: ${{ github.token }}

jobs:
  verify-and-publish-draft:
    name: Verify archive and official score, then publish draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.tag }}"
      - name: Validate the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            *[!A-Za-z0-9._/-]*)
              echo "release tag contains disallowed characters" >&2
              exit 1
              ;;
          esac
          TAG_SHA="$(git rev-parse HEAD)"
          echo "TAG_SHA=$TAG_SHA" >> "$GITHUB_ENV"
          echo "release tag validated: $RELEASE_TAG"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install locked environment
        run: uv sync --locked --all-groups
      - name: Download successful exact-SHA RDNA4 validation
        run: |
          RUN_ID="$(gh run list --workflow rdna4-hardware.yml \
            --commit "$TAG_SHA" --event workflow_dispatch --status success \
            --limit 100 --json databaseId,headSha \
            --jq 'map(select(.headSha == env.TAG_SHA)) | first | .databaseId // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "no successful manual RDNA4 validation exists for $TAG_SHA" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/hardware"
          gh run download "$RUN_ID" --pattern 'rdna4-gfx1200-*' \
            --dir "$RUNNER_TEMP/hardware"
          RECEIPT="$(find "$RUNNER_TEMP/hardware" -name receipt.json -type f -print -quit)"
          if [ -z "$RECEIPT" ]; then
            echo "RDNA4 validation receipt is absent or expired" >&2
            exit 1
          fi
          echo "HARDWARE_RECEIPT=$RECEIPT" >> "$GITHUB_ENV"
          echo "HARDWARE_EVIDENCE_DIR=$(dirname "$RECEIPT")" >> "$GITHUB_ENV"
      - name: Download draft release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release"
      - name: Verify archive SHA-256 against the attestation
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib, json, os, pathlib
          release = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release"
          attestation = json.loads(
              (release / "attestation.json").read_text(encoding="utf-8")
          )
          expected = attestation["archive"]["sha256"]
          archive = next(release.glob("*.tar.zst"))
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          if digest != expected:
              raise SystemExit(
                  f"archive SHA-256 {digest} != attestation {expected}"
              )
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "expected-sha256").write_text(expected)
          print(f"verified archive SHA-256: {expected}")
          PY
      - name: Verify exact-SHA hardware release binding
        run: |
          uv run --no-sync python scripts/internal/rdna4/verify_release_gate.py \
            --receipt "$HARDWARE_RECEIPT" \
            --evidence-dir "$HARDWARE_EVIDENCE_DIR" \
            --source-revision "$TAG_SHA" \
            --attestation "$RUNNER_TEMP/release/attestation.json" \
            --attestation-kind score \
            --binding-output "$RUNNER_TEMP/hardware-binding.json"
      - name: Verify the release archive and reproduce the official score
        run: |
          archive="$(echo "$RUNNER_TEMP"/release/*.tar.zst)"
          expected="$(cat "$RUNNER_TEMP/expected-sha256")"
          mkdir -p "$RUNNER_TEMP/unpacked"
          uv run --no-sync sol-execbench score release-verify "$archive" \
            --expected-sha256 "$expected" \
            --unpack-root "$RUNNER_TEMP/unpacked"
      - name: Rebuild the release archive deterministically
        run: |
          bundle="$(find "$RUNNER_TEMP/unpacked" -name release-bundle.json \
            | head -n 1)"
          uv run --no-sync sol-execbench score release-package "$bundle" \
            --archive-output "$RUNNER_TEMP/rebuilt.tar.zst" \
            --attestation-output "$RUNNER_TEMP/rebuilt.attestation.json" \
            --source-revision "$TAG_SHA" \
            --hardware-validation-receipt "$HARDWARE_RECEIPT" \
            --hardware-evidence-dir "$HARDWARE_EVIDENCE_DIR"
      - name: Require content-identical deterministic rebuild
        run: |
          uv run --no-sync python - <<'PY'
          import json, os, pathlib
          runner = pathlib.Path(os.environ["RUNNER_TEMP"])
          published = json.loads(
              (runner / "release" / "attestation.json").read_text()
          )
          rebuilt = json.loads(
              (runner / "rebuilt.attestation.json").read_text()
          )
          # The zstd byte stream is not reproducible across hosts/versions, so
          # require content identity (the verifier-validated evidence inventory
          # and the reproduced official score) rather than byte-identical bytes.
          if rebuilt["inventory_sha256"] != published["inventory_sha256"]:
              raise SystemExit(
                  "rebuilt evidence inventory != published inventory"
              )
          if rebuilt["official_score"] != published["official_score"]:
              raise SystemExit("rebuilt official score != published score")
          if rebuilt["hardware_validation"] != published["hardware_validation"]:
              raise SystemExit("rebuilt hardware validation != published binding")
          print("rebuilt evidence is content-identical to the published release")
          PY
      - name: Publish the draft release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false \
            --notes-file "$RUNNER_TEMP/release/attestation.json"
