name: RDNA4 Hardware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdna4-gfx1200
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  HIP_VISIBLE_DEVICES: "0"
  ROCR_VISIBLE_DEVICES: "0"

jobs:
  gfx1200-validation:
    name: RX 9060 XT gfx1200 validation
    runs-on: [self-hosted, linux, x64, rocm, gfx1200]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install locked environment
        run: uv sync --locked --all-groups
      - name: Run content-addressed RDNA4 validation
        run: |
          uv run --no-sync python \
            scripts/internal/rdna4/run_rdna4_validation.py \
            --output-dir out/rdna4-ci
      - name: Verify RDNA4 evidence against checkout
        run: |
          uv run --no-sync python \
            scripts/internal/rdna4/run_rdna4_validation.py \
            --verify out/rdna4-ci \
            --expected-source-revision "${GITHUB_SHA}" \
            --receipt-output out/rdna4-ci/receipt.json
      - name: Audit all scored SOLAR workloads
        run: |
          uv run --no-sync sol-execbench solar corpus-audit \
            "${RUNNER_TEMP}/solar-corpus-readiness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --device cuda:0 \
            --timeout 14400
      - name: Upload RDNA4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rdna4-gfx1200-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/rdna4-ci
          if-no-files-found: error
          retention-days: 30
      - name: Upload SOLAR corpus readiness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solar-corpus-readiness-gfx1200-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solar-corpus-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
