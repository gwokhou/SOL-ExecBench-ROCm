name: Python Quality

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"

defaults:
  run:
    shell: bash

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3

  quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install package
        run: uv sync --locked --all-groups
      - name: Run Ruff
        run: |
          uv run --no-sync ruff check . --output-format github
          uv run --no-sync ruff format --check . --output-format github
      - name: Run Ty
        run: uv run --no-sync ty check --output-format github
      - name: Run architecture guardrails
        run: |
          uv run --no-sync python scripts/check_coupling.py
          uv run --no-sync python scripts/check_readability.py
          uv run --no-sync python scripts/check_production_reachability.py
          uv run --no-sync python scripts/check_current_docs.py
          uv run --no-sync python scripts/check_schema_versions.py
          uv run --no-sync python scripts/check_non_canonical_artifacts.py
          uv run --no-sync python scripts/check_python_reuse.py
          uv run --no-sync python scripts/check_diagnostic_store_consistency.py

  package-tests:
    name: Package tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install package
        run: uv sync --locked --all-groups
      - name: Run sol-execbench tests
        run: |
          uv run --no-sync coverage erase
          uv run --no-sync coverage run -m pytest -n 0 tests/sol_execbench
          uv run --no-sync coverage combine
          uv run --no-sync coverage json -o sol-execbench-coverage.json
          uv run --no-sync python scripts/check_solar_coverage.py \
            sol-execbench-coverage.json \
            --policy scripts/sol_execbench_coverage_policy.json
      - name: Run tools tests
        run: uv run --no-sync pytest tests/tools tests/scripts

  default-parallel-tests:
    name: Default eight-worker suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install package
        run: uv sync --locked --all-groups
      - name: Run the configured test command
        run: uv run --no-sync pytest tests/
      - name: Verify wheel resources outside the checkout
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel"
          python -m zipfile -e "$RUNNER_TEMP"/wheel/*.whl "$RUNNER_TEMP/wheel-root"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/wheel-root" "$GITHUB_WORKSPACE/.venv/bin/python" -c \
            'from pathlib import Path; import solar; from sol_execbench.core.platform.docker_matrix import load_docker_target_manifest; assert Path(solar.__file__).is_relative_to(Path.cwd() / "wheel-root"); assert load_docker_target_manifest().default_target_id'

  macos-development:
    name: macOS development surface
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install package
        run: uv sync --locked --all-groups
      - name: Verify macOS-safe development paths
        run: |
          uv run --no-sync ty check
          uv run --no-sync pytest -n 0 \
            tests/sol_execbench/core/process \
            tests/sol_execbench/core/platform/test_docker_matrix_targets.py \
            tests/sol_execbench/core/bench/test_safetensors_io_unit.py \
            tests/solar/test_orojenesis.py

  solar-tests:
    name: Solar tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install package
        run: uv sync --locked --all-groups
      - name: Run Solar tests with branch coverage
        run: |
          uv run --no-sync coverage erase
          uv run --no-sync coverage run -m pytest -n 0 tests/solar
          uv run --no-sync coverage combine
          uv run --no-sync coverage json -o coverage.json
          uv run --no-sync python scripts/check_solar_coverage.py coverage.json
